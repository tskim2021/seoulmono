<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>プッシュ通知管理 | ソウルモノ</title><style>
*{box-sizing:border-box}body{margin:0;background:#f4f8fb;color:#203b50;font-family:system-ui,sans-serif}main{max-width:1040px;margin:36px auto;padding:24px}h1{font-size:30px;margin:8px 0}p{line-height:1.7}section{padding:24px;margin:20px 0;background:white;border:1px solid #dce7ef;border-radius:14px}label{display:block;font-weight:700;margin:18px 0 8px}input,textarea,select,button{font:inherit}input,textarea,select{width:100%;padding:12px;border:1px solid #b9cddc;border-radius:8px;background:white;color:#203b50}button{cursor:pointer;padding:13px 22px;background:#397aa3;color:white;border:0;border-radius:8px;font-weight:700;margin-top:18px}button:disabled{opacity:.5;cursor:default}.muted{color:#526b7d;font-size:14px}.cards{display:flex;gap:12px;flex-wrap:wrap}.cards span{padding:16px;background:#e7f2f9;border-radius:10px;flex:1;min-width:180px}#message{white-space:pre-wrap;padding:12px;background:#e7f2f9;border-radius:8px}.error{color:#9e2c22}table{width:100%;border-collapse:collapse;font-size:13px}td,th{text-align:left;padding:12px 6px;border-bottom:1px solid #e3ebf1;vertical-align:top}td:first-child{max-width:280px;overflow-wrap:anywhere}[hidden]{display:none!important}a{color:#397aa3}.table-wrap{overflow:auto}
</style></head><body><main><a href="/admin" target="_top">← 管理画面</a><h1>プッシュ通知管理</h1><p>アプリで通知を有効にした会員へお知らせを配信します。</p><div id="message" role="status" aria-live="polite">接続しています…</div>
<section id="login" hidden><h2>管理者ログイン</h2><p class="muted">既存の管理者アカウントを使用してください。</p><form id="login-form"><label for="id">ID</label><input id="id" autocomplete="username" required><label for="password">パスワード</label><input id="password" type="password" autocomplete="current-password" required><button>ログイン</button></form></section>
<div id="console" hidden><section><h2>配信の状態</h2><div id="counts" class="cards"></div><button id="refresh" type="button">更新</button><p class="muted">「受付済み」は Apple / Google の受付結果です。実機での表示・開封を保証するものではありません。</p></section>
<section><h2>通知を作成</h2><form id="send-form"><label for="target">宛先</label><select id="target"><option value="self">自分のアプリへテスト</option><option value="member">会員IDを指定</option><option value="all">通知を有効にした全端末</option></select><div id="member-field" hidden><label for="member">会員ID</label><input id="member" maxlength="255"></div><label for="title">タイトル</label><input id="title" maxlength="100" value="ソウルモノからのお知らせ" required><label for="body">本文</label><textarea id="body" rows="4" maxlength="1000" required></textarea><label for="path">タップ時に開く画面</label><input id="path" value="/" maxlength="500" required><p class="muted">ホーム：/　商品：/product/商品ID　お知らせ：/notices　イベント：/events</p><button id="send">送信内容を確認</button></form></section>
<section><h2>最近の配信</h2><div class="table-wrap"><table><thead><tr><th>通知</th><th>対象</th><th>受付済み</th><th>待機中</th><th>失敗 / 対象外</th></tr></thead><tbody id="history"></tbody></table></div></section></div>
<script>
let token='',requestId=null;const el=id=>document.getElementById(id);const message=(text,error=false)=>{el('message').textContent=text;el('message').className=error?'error':'';};
async function api(path,body){const r=await fetch('/api'+path,{method:body?'POST':'GET',credentials:'same-origin',headers:{'Content-Type':'application/json',...(token?{Authorization:'Bearer '+token}:{})},...(body?{body:JSON.stringify(body)}:{})});const d=await r.json();if(!r.ok){const e=new Error(d.error||d.message||'通信に失敗しました。');e.status=r.status;throw e;}return d;}
async function refresh(){try{const d=await api('/push/admin/status');el('console').hidden=false;el('login').hidden=true;el('counts').replaceChildren();for(const [platform,name] of [['android','Android'],['ios','iPhone']]){const s=document.createElement('span');s.textContent=name+'：'+(d.devices.find(x=>x.platform===platform)?.count||0)+'台 / '+(d.ready[platform]?'配信設定済み':'配信設定を準備中');el('counts').append(s);}el('history').replaceChildren();for(const c of d.campaigns){const row=document.createElement('tr');for(const value of [c.title+'\n'+c.created_at,c.total,c.sent||0,c.pending||0,(c.failed||0)+' / '+(c.skipped||0)]){const td=document.createElement('td');td.textContent=String(value);row.append(td);}el('history').append(row);}message('端末一覧と配信状況を更新しました。');}catch(e){message(e.message,true);if(e.status===401||e.status===403){el('login').hidden=false;el('console').hidden=true;}}}
el('login-form').onsubmit=async e=>{e.preventDefault();const b=e.target.querySelector('button');b.disabled=true;try{const d=await api('/auth/login',{mb_id:el('id').value,mb_password:el('password').value});el('password').value='';if(!d.user?.is_admin)throw new Error('管理者権限が必要です。');token=d.token;await refresh();}catch(e){message(e.message,true);}finally{b.disabled=false;}};
el('target').onchange=()=>{el('member-field').hidden=el('target').value!=='member';el('member').required=el('target').value==='member';requestId=null;};
el('send-form').oninput=()=>{requestId=null;};
el('send-form').onsubmit=async e=>{e.preventDefault();const payload={title:el('title').value,body:el('body').value,path:el('path').value,target:el('target').value,memberId:el('member').value};if(!confirm('宛先：'+el('target').selectedOptions[0].textContent+'\n\n'+payload.title+'\n'+payload.body+'\n\nこの内容で通知を送信しますか？'))return;el('send').disabled=true;requestId=requestId||crypto.randomUUID();try{const d=await api('/push/admin/send',{...payload,requestId});requestId=null;await refresh();message(d.queued+'台への通知を登録しました。配信状況は「更新」で確認できます。');}catch(e){message(e.message,true);}finally{el('send').disabled=false;}};
el('refresh').onclick=refresh;refresh();
</script></main></body></html>
