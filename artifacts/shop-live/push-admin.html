<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>푸시 알림 관리 | 서울모노</title><style>
*{box-sizing:border-box}body{margin:0;background:#f4f8fb;color:#203b50;font-family:system-ui,sans-serif}main{max-width:1040px;margin:36px auto;padding:24px}h1{font-size:30px;margin:8px 0}p{line-height:1.7}section{padding:24px;margin:20px 0;background:white;border:1px solid #dce7ef;border-radius:14px}label{display:block;font-weight:700;margin:18px 0 8px}input,textarea,select,button{font:inherit}input,textarea,select{width:100%;padding:12px;border:1px solid #b9cddc;border-radius:8px;background:white;color:#203b50}button{cursor:pointer;padding:13px 22px;background:#397aa3;color:white;border:0;border-radius:8px;font-weight:700;margin-top:18px}button:disabled{opacity:.5;cursor:default}.muted{color:#526b7d;font-size:14px}.cards{display:flex;gap:12px;flex-wrap:wrap}.cards span{padding:16px;background:#e7f2f9;border-radius:10px;flex:1;min-width:180px}#message{white-space:pre-wrap;padding:12px;background:#e7f2f9;border-radius:8px}.error{color:#9e2c22}table{width:100%;border-collapse:collapse;font-size:13px}td,th{text-align:left;padding:12px 6px;border-bottom:1px solid #e3ebf1;vertical-align:top}td:first-child{max-width:280px;overflow-wrap:anywhere}[hidden]{display:none!important}a{color:#397aa3}.table-wrap{overflow:auto}
</style></head><body><main><a href="/admin" target="_top">← 관리자 화면</a><h1>푸시 알림 관리</h1><p>앱 알림을 활성화한 회원에게 알림을 보냅니다。</p><div id="message" role="status" aria-live="polite">연결 중…</div>
<section id="login" hidden><h2>관리자 로그인</h2><p class="muted">기존 관리자 계정을 사용하세요。</p><form id="login-form"><label for="id">아이디</label><input id="id" autocomplete="username" required><label for="password">비밀번호</label><input id="password" type="password" autocomplete="current-password" required><button>로그인</button></form></section>
<div id="console" hidden><section><h2>발송 상태</h2><div id="counts" class="cards"></div><button id="refresh" type="button">새로고침</button><p class="muted">‘접수됨’은 Apple / Google의 접수 결과이며 실제 기기 표시·열람을 보장하지 않습니다。</p></section>
<section><h2>알림 만들기</h2><form id="send-form"><label for="target">대상</label><select id="target"><option value="self">내 앱으로 테스트</option><option value="member">회원 ID 지정</option><option value="all">알림을 활성화한 모든 기기</option></select><div id="member-field" hidden><label for="member">회원 ID</label><input id="member" maxlength="255"></div><label for="title">제목</label><input id="title" maxlength="100" value="서울모노 알림" required><label for="body">본문</label><textarea id="body" rows="4" maxlength="1000" required></textarea><label for="path">탭할 때 열 화면</label><input id="path" value="/" maxlength="500" required><p class="muted">홈: /　상품: /product/상품ID　공지: /notices　이벤트: /events</p><button id="send">발송 내용 확인</button></form></section>
<section><h2>최근 발송</h2><div class="table-wrap"><table><thead><tr><th>알림</th><th>대상</th><th>접수됨</th><th>대기 중</th><th>실패 / 제외</th></tr></thead><tbody id="history"></tbody></table></div></section></div>
<script>
let token='',requestId=null;const el=id=>document.getElementById(id);const message=(text,error=false)=>{el('message').textContent=text;el('message').className=error?'error':'';};
async function api(path,body){const r=await fetch('/api'+path,{method:body?'POST':'GET',credentials:'same-origin',headers:{'Content-Type':'application/json',...(token?{Authorization:'Bearer '+token}:{})},...(body?{body:JSON.stringify(body)}:{})});const d=await r.json();if(!r.ok){const e=new Error(d.error||d.message||'통신에 실패했습니다。');e.status=r.status;throw e;}return d;}
async function refresh(){try{const d=await api('/push/admin/status');el('console').hidden=false;el('login').hidden=true;el('counts').replaceChildren();for(const [platform,name] of [['android','Android'],['ios','iPhone']]){const s=document.createElement('span');s.textContent=name+'：'+(d.devices.find(x=>x.platform===platform)?.count||0)+'대 / '+(d.ready[platform]?'발송 설정 완료':'발송 설정 준비 중');el('counts').append(s);}el('history').replaceChildren();for(const c of d.campaigns){const row=document.createElement('tr');for(const value of [c.title+'\n'+c.created_at,c.total,c.sent||0,c.pending||0,(c.failed||0)+' / '+(c.skipped||0)]){const td=document.createElement('td');td.textContent=String(value);row.append(td);}el('history').append(row);}message('기기 목록과 발송 상태를 업데이트했습니다.');}catch(e){message(e.message,true);if(e.status===401||e.status===403){el('login').hidden=false;el('console').hidden=true;}}}
el('login-form').onsubmit=async e=>{e.preventDefault();const b=e.target.querySelector('button');b.disabled=true;try{const d=await api('/auth/login',{mb_id:el('id').value,mb_password:el('password').value});el('password').value='';if(!d.user?.is_admin)throw new Error('관리자 권한이 필요합니다。');token=d.token;await refresh();}catch(e){message(e.message,true);}finally{b.disabled=false;}};
el('target').onchange=()=>{el('member-field').hidden=el('target').value!=='member';el('member').required=el('target').value==='member';requestId=null;};
el('send-form').oninput=()=>{requestId=null;};
el('send-form').onsubmit=async e=>{e.preventDefault();const payload={title:el('title').value,body:el('body').value,path:el('path').value,target:el('target').value,memberId:el('member').value};if(!confirm('대상：'+el('target').selectedOptions[0].textContent+'\n\n'+payload.title+'\n'+payload.body+'\n\n이 내용으로 알림을 발송할까요?'))return;el('send').disabled=true;requestId=requestId||crypto.randomUUID();try{const d=await api('/push/admin/send',{...payload,requestId});requestId=null;await refresh();message(d.queued+'대에 알림을 등록했습니다. 발송 상태는 ‘새로고침’으로 확인할 수 있습니다。');}catch(e){message(e.message,true);}finally{el('send').disabled=false;}};
el('refresh').onclick=refresh;refresh();
</script></main></body></html>
