server {
    listen 80;
    server_name seoulmono.com www.seoulmono.com seoulmono.com www.seoulmono.com seoulmono.com www.seoulmono.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name seoulmono.com www.seoulmono.com seoulmono.com www.seoulmono.com seoulmono.com www.seoulmono.com;

    ssl_certificate /etc/letsencrypt/live/seoulmono.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/seoulmono.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml text/javascript application/json application/javascript application/xml+rss image/svg+xml;

    location /api/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        client_max_body_size 50M;
    }

    # B2B: copy order-system dist into shop dist/b2b/ during deploy
    # All files physically exist — simple root, no alias, no symlink
    location /b2b/ {
        root /var/www/seoulmono/artifacts/shop/dist/public;
        try_files $uri $uri/ =404;
    }

    # Shop SPA fallback for non-asset paths
    location / {
        root /var/www/seoulmono/artifacts/shop/dist/public;
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }
}
