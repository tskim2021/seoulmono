# SEC-RATELIMIT (2026-10-17): 무차별 대입·인증메일 남용 방지. 키가 빈 문자열이면 제한 대상이 아님(해당 주소만 제한).
map $uri $seoulmono_rl_login  { default ""; ~^/api/auth/(login|find-id|find-password)/?$ $binary_remote_addr; }
map $uri $seoulmono_rl_code   { default ""; ~^/api/auth/(email-send-code|sms-send)/?$ $binary_remote_addr; }
map $uri $seoulmono_rl_verify { default ""; ~^/api/auth/(email-verify-code|sms-verify|register-shop)/?$ $binary_remote_addr; }
map $request_uri $seoulmono_rl_admin { default ""; ~*^/admin/trpc/[^?]*login $binary_remote_addr; }

limit_req_zone $seoulmono_rl_login  zone=seoulmono_login:10m  rate=10r/m;
limit_req_zone $seoulmono_rl_code   zone=seoulmono_code:10m   rate=3r/m;
limit_req_zone $seoulmono_rl_verify zone=seoulmono_verify:10m rate=10r/m;
limit_req_zone $seoulmono_rl_admin  zone=seoulmono_admin:10m  rate=10r/m;
limit_req_status 429;
limit_req_log_level warn;
