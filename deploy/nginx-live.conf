server {
    server_name seoulmono.com www.seoulmono.com;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml text/javascript application/json application/javascript application/xml+rss image/svg+xml;

    client_max_body_size 50M;

    # SEC-BLOCK-INTERNAL: endpoints that must never be reachable from the internet.
    # admin2 calls the shop API on 127.0.0.1:8080 directly, so it is not affected.
    location ~* ^/api/internal(/|$) { return 404; }
    # admin2 is admin-only: public account-management procedures are not needed (login/auth.me/logout stay open).
    location ~* ^/admin/trpc/.*localAuth\.(register|requestPasswordReset|findAccount|checkAvailability) { return 404; }

    # SEC-BLOCK-LEGACY: unverified public signup + EV demo module (open mail relay once SMTP works); not used by the storefront
    location ~* ^/api/auth/register/?$ { return 404; }
    location ~* ^/api/electric(/|$) { return 404; }

    # SEC-BLOCK-LEGACY2 (2026-10-05): legacy routes that are unauthenticated or hand out value; the storefront never calls them
    #  - kakao-channel-*: any logged-in member could claim a free 1,000-point credit (= 1,000 yen off at checkout) with no Kakao check
    #  - debug/notice: unauthenticated DESCRIBE + latest rows of the notice table
    #  - seed-demo: unauthenticated wipe + re-seed of the today-deal / group-buy sections
    location ~* ^/api/shop/kakao-channel-(point|status)/?$ { return 404; }
    location ~* ^/api/debug(/|$) { return 404; }
    location ~* ^/api/shop/seed-demo/?$ { return 404; }

    location /api/ {
        # SEC-RATELIMIT (2026-10-17): 키가 비어 있는 주소는 제한 없음, conf.d/seoulmono-ratelimit.conf 참고
        limit_req zone=seoulmono_login burst=8 nodelay;
        limit_req zone=seoulmono_code burst=2 nodelay;
        limit_req zone=seoulmono_verify burst=5 nodelay;
        include snippets/seoulmono-sec-headers.conf;
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /uploads/ {
        include snippets/seoulmono-sec-headers.conf;
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
    }

    location = /favicon.ico {
        return 204;
    }

    location = /robots.txt {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
    }

    location = /sitemap.xml {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
    }

    location = /b2b/favicon.ico {
        return 204;
    }

    # Standalone push console; its API requires an existing administrator session.
    location = /admin/push {
        include snippets/seoulmono-sec-headers.conf;
        alias /var/www/seoulmono/artifacts/shop/dist/public/push-admin.html;
        default_type text/html;
        add_header Cache-Control "no-store";
    }
    location = /admin/push/ { return 302 /admin/push; }

    # 탈모2 기반 신규 관리자 (seoulmono-admin2, pm2 :8090)
    # proxy_pass 끝의 슬래시가 /admin 접두사를 떼고 넘긴다.
    location /admin/ {
        limit_req zone=seoulmono_admin burst=8 nodelay;
        include snippets/seoulmono-sec-headers.conf;
        proxy_pass http://127.0.0.1:8090/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 50M;
    }

    location = /admin { return 301 /admin/; }

    # legacy: old /admin2 links still work
    location /admin2/ { return 301 /admin/; }
    location = /admin2 { return 301 /admin/; }

    # B2B (order-system) static, physically under shop dist/public/b2b
    # legacy Korean B2B module: nothing is deployed behind this path any more (it used to answer 500)
    location /b2b/ {
        return 404;
    }

    # Product detail page — server-rendered meta tags for social/crawler previews
    location ~ ^/item/[^/]+$ {
        include snippets/seoulmono-sec-headers.conf;
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Shop SPA
    location / {
        include snippets/seoulmono-sec-headers.conf;
        root /var/www/seoulmono/artifacts/shop/dist/public;
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    listen [::]:443 ssl ipv6only=on; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/seoulmono.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/seoulmono.com/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot


}
server {
    if ($host = www.seoulmono.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    if ($host = seoulmono.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    listen [::]:80;
    server_name seoulmono.com www.seoulmono.com;
    return 404; # managed by Certbot




}