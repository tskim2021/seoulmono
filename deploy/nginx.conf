# seoulmono.com — certbot (--nginx) が 443/SSL ブロックを自動追加します
server {
    listen 80;
    listen [::]:80;
    server_name seoulmono.com www.seoulmono.com;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css text/xml text/javascript application/json application/javascript image/svg+xml;

    client_max_body_size 50M;

    location /api/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /b2b/ {
        alias /var/www/seoulmono/artifacts/order-system/dist/public/;
        try_files $uri $uri/ /b2b/index.html;
    }

    location / {
        root /var/www/seoulmono/artifacts/shop/dist/public;
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
